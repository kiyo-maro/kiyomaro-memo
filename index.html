<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>清麻呂メモ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#19191d;--muted:#a5a4aa;--gold:#deb76b;--line:#333238}*{box-sizing:border-box}body{background:var(--bg);color:#f5f3ed;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 50px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:32px;letter-spacing:.02em;margin:0}.sub{color:var(--gold);font-size:11px;letter-spacing:.25em}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--gold);border-radius:13px;padding:10px 14px;font-size:19px}input.search{width:100%;background:#222126;color:white;border:1px solid var(--line);border-radius:13px;padding:14px 15px;outline:none;margin-bottom:18px}input:focus,textarea:focus{border-color:var(--gold)}.count{font-size:12px;color:var(--muted);margin:0 0 12px}ul{padding:0;margin:0;list-style:none}.note{border-bottom:1px solid var(--line);padding:15px 5px;display:flex;align-items:center;gap:12px}.note-main{flex:1;background:none;border:0;text-align:left;color:inherit;min-width:0}.note-title{font-size:17px;font-weight:650;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-preview{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{font-size:11px;color:#85848b;margin-top:7px}.pin{background:none;border:0;font-size:21px;color:var(--gold);padding:8px}.empty{text-align:center;color:var(--muted);padding:72px 12px;line-height:2}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.toolbar button,.back{background:#242328;border:1px solid var(--line);color:#f5f3ed;border-radius:10px;padding:11px 13px}.toolbar .danger{color:#ff9c9c}.editor{display:none}.editor.on{display:block}.listview.off{display:none}.edactions{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.edactions button{border:0;background:none;color:var(--gold);padding:10px 0}.titleinput{width:100%;background:transparent;border:0;color:white;font-size:27px;font-weight:700;outline:none;margin-bottom:18px}.bodyinput{width:100%;min-height:45vh;background:transparent;color:#f5f3ed;border:0;outline:none;resize:vertical;line-height:1.7}.editor .meta{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#3d3528;color:#ffe1a7;border-radius:30px;display:none;font-size:13px}footer{color:#85848b;font-size:11px;line-height:1.7;margin-top:22px}input[type=file]{display:none}
</style></head><body><main class="wrap"><section class="listview" id="listview"><header><div><div class="sub">PRIVATE NOTEBOOK</div><h1>清麻呂メモ</h1></div><button class="iconbtn" id="newBtn" aria-label="新規メモ">＋</button></header><input class="search" id="search" placeholder="⌕  メモを検索" aria-label="メモを検索"><p class="count" id="count"></p><ul id="notes"></ul><div class="toolbar"><button id="exportBtn">⬇ バックアップ保存</button><button id="importBtn">⬆ バックアップ復元</button><input id="importFile" type="file" accept="application/json,.json"></div><footer>メモはこのブラウザの端末内領域に保存されます。Safariの履歴・Webサイトデータ削除などで失われる場合があるため、定期的にバックアップを保存してください。オフライン起動には、HTTPSで配信してホーム画面に追加する必要があります。</footer></section><section class="editor" id="editor"><div class="edactions"><button id="backBtn">〈 メモ一覧</button><div><button id="deleteBtn">削除</button>　<button id="pinBtn">固定</button></div></div><input id="titleField" class="titleinput" placeholder="タイトル" aria-label="タイトル"><textarea id="bodyField" class="bodyinput" placeholder="ここにメモを書く…" aria-label="メモ本文"></textarea><div class="meta" id="savedStatus">自動保存</div></section></main><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='kiyomaro-memo-v1';let items=[],active=null;const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));$('savedStatus').textContent='保存済み';return true}catch(e){toast('保存できません。容量またはブラウザ設定を確認してください');return false}}try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))items=raw.filter(x=>x&&typeof x.id==='string').map(x=>({id:x.id,title:String(x.title||''),body:String(x.body||''),pinned:!!x.pinned,updated:Number(x.updated)||Date.now()}))}catch(e){toast('保存データを読み込めませんでした。上書き前にバックアップを確認してください')}function render(){const q=$('search').value.trim().toLowerCase(),sorted=[...items].filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);$('count').textContent=sorted.length+' 件のメモ';$('notes').replaceChildren();if(!sorted.length){const e=document.createElement('div');e.className='empty';e.textContent=q?'一致するメモはありません':'右上の ＋ から最初のメモを作ろう';$('notes').append(e)}for(const n of sorted){let li=document.createElement('li');li.className='note';let main=document.createElement('button');main.className='note-main';let t=document.createElement('div');t.className='note-title';t.textContent=n.title||'無題のメモ';let p=document.createElement('div');p.className='note-preview';p.textContent=n.body.replace(/\s+/g,' ').slice(0,100)||'本文なし';let d=document.createElement('div');d.className='date';d.textContent=new Date(n.updated).toLocaleString('ja-JP');main.append(t,p,d);main.onclick=()=>openNote(n.id);let pin=document.createElement('button');pin.className='pin';pin.textContent=n.pinned?'◆':'◇';pin.title=n.pinned?'固定を解除':'メモを固定';pin.onclick=()=>{n.pinned=!n.pinned;n.updated=Date.now();persist();render()};li.append(main,pin);$('notes').append(li)}}function openNote(id){active=id;const n=items.find(n=>n.id===id);if(!n)return;$('titleField').value=n.title;$('bodyField').value=n.body;$('pinBtn').textContent=n.pinned?'固定解除':'固定';$('savedStatus').textContent='自動保存';$('listview').classList.add('off');$('editor').classList.add('on');window.scrollTo(0,0)}function back(){active=null;$('editor').classList.remove('on');$('listview').classList.remove('off');render()}$('newBtn').onclick=()=>{const n={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),title:'',body:'',pinned:false,updated:Date.now()};items.unshift(n);persist();openNote(n.id);$('titleField').focus()};for(const fld of ['titleField','bodyField'])$(fld).addEventListener('input',()=>{const n=items.find(n=>n.id===active);if(!n)return;n.title=$('titleField').value;n.body=$('bodyField').value;n.updated=Date.now();persist()});$('backBtn').onclick=back;$('deleteBtn').onclick=()=>{if(!confirm('このメモを削除しますか？'))return;items=items.filter(n=>n.id!==active);persist();back()};$('pinBtn').onclick=()=>{const n=items.find(n=>n.id===active);if(n){n.pinned=!n.pinned;persist();$('pinBtn').textContent=n.pinned?'固定解除':'固定'}};$('search').oninput=render;$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'kiyomaro-memo',version:1,exportedAt:new Date().toISOString(),notes:items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kiyomaro-memo-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを書き出しました')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.app!=='kiyomaro-memo'||!Array.isArray(raw.notes)||raw.notes.length>20000||raw.notes.some(n=>!n||typeof n.id!=='string'||typeof n.title!=='string'||typeof n.body!=='string'||n.body.length>2e6))throw Error();if(!confirm('現在のメモ '+items.length+' 件を、バックアップ '+raw.notes.length+' 件で置き換えます。よろしいですか？'))return;const old=items;items=raw.notes.map(n=>({id:n.id,title:n.title,body:n.body,pinned:!!n.pinned,updated:Number(n.updated)||Date.now()}));if(!persist()){items=old;return}render();toast('復元しました')}catch(err){toast('対応するバックアップファイルではありません')}finally{e.target.value=''}};if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
</script></body></html>
